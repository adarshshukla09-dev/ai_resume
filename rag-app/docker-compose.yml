version: "3.9"

services:
  valkey:
    image: valkey/valkey:7.2
    container_name: valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--appendonly", "yes"]

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  valkey_data:
  qdrant_data: